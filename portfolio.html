<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <section class="todo-container">
        <h1>TaskFlow</h1>
        <p class="subtitle">Organize your tasks and stay productive.</p>

        <!-- Add Task -->
        <form id="taskForm">
          <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
            autocomplete="off"
            required
          />
          <button type="submit">Add Task</button>
        </form>

        <!-- Filters -->
        <div class="filters">
          <button type="button" class="filter active" data-filter="all">
            All
          </button>

          <button type="button" class="filter" data-filter="active">
            Active
          </button>

          <button type="button" class="filter" data-filter="completed">
            Completed
          </button>
        </div>

        <!-- Task Statistics -->
        <div class="task-stats">
          <span id="taskCount">0 tasks</span>
          <button type="button" id="clearCompleted">Clear Completed</button>
        </div>

        <!-- Tasks will be added here using JavaScript -->
        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
